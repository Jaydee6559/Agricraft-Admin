<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriCraft Market Admin - Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Kumbh+Sans:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="login-container">
    <h1 class="title">AgriCraft Market Admin</h1>

    <form class="login-form" action="home.html" method="get">
      <p class="subtitle">Login to your Account</p>

      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required />
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required />
      </div>

      <button type="submit" class="login-btn">Login</button>
      
    </form>
  </div>
</body>
</html>
