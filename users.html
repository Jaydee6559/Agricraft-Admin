<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Users Dashboard - AgriCraft Admin</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="hamb">≡</div>
      <div class="avatar"></div>
      <a class="icon" href="users.html">👥</a>
      <div class="brand">AgriCraft Market</div>
    </aside>

    <main class="container">
      <div class="topbar">
        <div><div class="title">Users Dashboard</div><div class="welcome">Total Users <span id="total-users" class="stat-number">0</span></div></div>
        <div class="kv">AgriCraft Market</div>
      </div>

      <section class="panel">
        <table class="table">
          <thead>
            <tr><th>Id</th><th>Full Name</th><th>Number</th><th>Email</th><th>Valid Id Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="users-tbody">
            <!-- injected -->
          </tbody>
        </table>

        <div style="display:flex;justify-content:center;margin-top:16px">
          <button id="refresh-users" class="btn">Refresh</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { getAllDocs, deleteDocById } from './firebase.js';
    const tbody = document.getElementById('users-tbody');
    const totalEl = document.getElementById('total-users');
    const refreshBtn = document.getElementById('refresh-users');

    function row(u) {
      return `<tr data-id="${u.id}">
        <td>${u.id}</td>
        <td>${u.fullName ?? u.name ?? '-'}</td>
        <td>${u.phone ?? u.number ?? '-'}</td>
        <td>${u.email ?? '-'}</td>
        <td class="${u.status === 'verified' ? 'status-ok' : 'status-pending'}">${u.status ?? '-'}</td>
        <td><button class="btn ghost delete">Delete</button></td>
      </tr>`;
    }

    async function load() {
      tbody.innerHTML = '<tr><td colspan="6">Loading…</td></tr>';
      const list = await getAllDocs('users');
      totalEl.textContent = list.length;
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6">No users</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(row).join('');
      attach();
    }

    function attach() {
      tbody.querySelectorAll('button.delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const tr = e.target.closest('tr'); const id = tr.dataset.id;
          if (!confirm('Delete this user?')) return;
          e.target.disabled = true;
          const ok = await deleteDocById('users', id);
          if (ok) tr.remove();
        });
      });
    }

    refreshBtn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
