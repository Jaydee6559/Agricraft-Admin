<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Users Dashboard - AgriCraft Admin</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="hamb">≡</div>
      <div class="avatar"></div>
      <a class="icon" href="home.html" title="Home">🏠</a>
      <a class="icon" href="users.html" title="Users">👥</a>
      <a class="icon" href="valid-id.html" title="Valid Ids">🪪</a>
      <a class="icon" href="shop-user.html" title="Shops">🏬</a>
      <a class="icon" href="product-validation.html" title="Products">🛒</a>
      <div class="brand">AgriCraft Market</div>
    </aside>

    <main class="container">
      <div class="topbar">
        <div>
          <div class="title">Users Dashboard</div>
          <div class="welcome">Total Users <span id="total-users" class="stat-number">0</span></div>
        </div>
        <div class="kv">AgriCraft Market</div>
      </div>

      <section class="panel">
        <table class="table">
          <thead>
            <tr>
              <th>Id</th>
              <th>Name</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody">

          </tbody>
        </table>

        <div style="display:flex;justify-content:center;margin-top:16px">
          <button id="refresh-users" class="btn">Refresh</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./protect.js"></script>
  <script type="module" src="./users-fetch.js"></script>
</body>
</html>
