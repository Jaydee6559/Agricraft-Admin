<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valid ID Admin</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <script type="module" src="./protect.js"></script>

  <div class="app">
    <aside class="sidebar">
      <div class="hamb">≡</div>
      <div class="avatar" title="Admin"></div>
      <a class="icon" href="home.html" title="Home">🏠</a>
      <a class="icon" href="users.html" title="Users">👥</a>
      <a class="icon" href="valid-id.html" title="Valid Ids">🪪</a>
      <a class="icon" href="shop-user.html" title="Shops">🏬</a>
      <a class="icon" href="product-validation.html" title="Products">🛒</a>
      <div class="brand">AgriCraft Market</div>
    </aside>

    <main class="container">
      <div class="topbar">
        <div>
          <div class="title">Valid ID Verification</div>
          <div class="welcome">Approve or reject pending valid IDs</div>
        </div>
      </div>

      <section class="content-grid">
        <div class="panel">
          <strong>Pending Valid IDs</strong>
          <div id="list" style="margin-top:12px"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { getUsersByValidIdStatus, validateUserValidId, getUserById } from './firebase.js';

    const listEl = document.getElementById('list');

   
    function renderUserItem(item) {
      const el = document.createElement('div');
      el.className = 'id-item';
      el.style = 'border:1px solid #ddd;padding:12px;margin-bottom:8px;border-radius:6px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between';
      el.innerHTML = `
        <div style="flex:1">
          <div><strong>Name:</strong> ${item.fullName || item.firstName || item.name || '—'}</div>
          <div><strong>Email:</strong> ${item.email || '—'}</div>
          <div><strong>Phone:</strong> ${item.phoneNumber || item.phone || '-'}</div>
          <div style="margin-top:8px"><strong>Valid Id Status:</strong> <span class="status">${item.validIdStatus || '-'}</span></div>
          <div class="id-preview" style="margin-top:12px"></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
          <div style="display:flex;gap:8px">
            <button class="btn ghost view-id">View ID</button>
            <button class="btn validate-user">Validate</button>
          </div>
          <button class="btn ghost refresh-item">Refresh</button>
        </div>
      `;

      const btnView = el.querySelector('.view-id');
      const btnValUser = el.querySelector('.validate-user');
      const statusSpan = el.querySelector('.status');
      const btnRefresh = el.querySelector('.refresh-item');
      const previewEl = el.querySelector('.id-preview');

      btnView.addEventListener('click', () => {
        previewEl.innerHTML = '';
        const data = item.validId || item.validIdImage || item.validIdUri || item.validIdBase64;
        if (data && typeof data === 'string') {
          const img = document.createElement('img');
          img.style = 'max-width:320px;border-radius:8px;border:1px solid #eee';
          img.src = data;
          previewEl.appendChild(img);
        } else {
          previewEl.textContent = 'No valid id image on this user document.';
        }
      });

      btnValUser.addEventListener('click', async () => {
        btnValUser.disabled = true;
        btnValUser.textContent = 'Validating...';
        const ok = await validateUserValidId(item.id);
        if (ok) {
          statusSpan.textContent = 'validated';
          btnValUser.textContent = 'Validated';
          btnValUser.disabled = true;
        } else {
          btnValUser.textContent = 'Validate';
          btnValUser.disabled = false;
          alert('Failed to validate user. Check console for errors.');
        }
      });

      btnRefresh.addEventListener('click', () => loadList());

      return el;
    }

    async function loadList() {
      listEl.innerHTML = 'Loading...';
  
      const users = await getUsersByValidIdStatus('pending');
      if (!users.length) {
        listEl.innerHTML = '<div class="empty-box">No pending valid IDs (users)</div>';
        return;
      }
      listEl.innerHTML = '';
      users.forEach(u => listEl.appendChild(renderUserItem(u)));
    }

    loadList();
   </script>
 </body>
 </html>
